# Repo-wide policy for the age mirror.
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# bin_scan, metadata, catalog, tests, versions, announce, annotations — stays
# in age/mirror.yml.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge. `platforms:`
# is where this bites: it carries BOTH the runner matrix and the container
# legs, so a child that restates it to tweak one runner silently drops every
# `containers:` entry. Nothing reds — the legs simply stop existing, and every
# os.features claim in that spec goes back to being merely asserted. This repo
# is single-package, so `platforms:` lives HERE and age/mirror.yml does not
# restate it — the trap is structurally eliminated rather than merely avoided.

skip_prereleases: true
cascade: true

# New package, so the fleet rule applies unconditionally. A cascade tag
# (`latest`, `1`, `1.3`) re-points on every re-publish; without a build segment
# the new manifest reuses the bare version tag and orphans the prior digest for
# registry GC, breaking any `@sha256:` pin in a consumer's ocx.lock. The `none`
# exception applies only where upstream versions ALREADY carry semver build
# metadata — age tags bare semver behind a `v` (`v1.3.1`), so it does not.
build_timestamp: date

verify:
  github_asset_digest: true

concurrency:
  # Assets are ~9–10 MB tarballs holding four static Go binaries each.
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# ─── Platform matrix ────────────────────────────────────────────────────────
#
# `os.features` states what an artifact REQUIRES OF THE HOST — it is not a
# label for how it was built. Both Linux keys are BARE because the linkage says
# so, measured on all four declared binaries × both arches × both in-range
# releases (evidence reproduced above age/mirror.yml's `assets:`):
#
#   $ file x-1.3.1-amd64/age/age
#   ELF 64-bit LSB executable, x86-64, version 1 (SYSV), statically linked, …
#   $ readelf -l … | grep -c INTERP  → 0    (16/16 artifacts)
#   $ readelf -d … | grep -c NEEDED  → 0    (16/16 artifacts)
#
# Statically linked, zero PT_INTERP, zero DT_NEEDED ⇒ the artifact requires
# NOTHING of the host userland ⇒ bare `linux/amd64` and bare `linux/arm64`.
# `+libc.musl` would be a false requirement that hid the package from every
# glibc host it in fact runs on, and `+libc.glibc` would hide it from musl.
#
# A bare key claims universality, so it must PROVE it: ubuntu (glibc) + alpine
# (musl) + fedora (a different glibc vintage) on BOTH arches. THE ALPINE LEG IS
# THE PROOF — drop it and the universal claim is merely asserted. No
# `containers[].setup` is needed: a zero-DT_NEEDED binary pulls in no shared
# library any base image could be missing.
#
# Staged rollout (skill Phase 10): darwin and windows are pre-written and
# commented out below AND in age/mirror.yml's `assets:`, uncommented one pass
# at a time once the Linux legs are end-to-end green. Both a platform key and
# its asset pattern are commented together — a declared-but-unmatched platform
# still boots a real runner and reports SUCCESS having tested nothing.
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  linux/arm64:
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.
  #
  # PASS 2 — uncomment together with the darwin `assets:` patterns.
  # darwin/amd64:
  #   # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 —
  #   # GitHub's native macos-13 Intel pool is exhausted and deadlocks push.
  #   runner: macos-14
  #   prefix: ["arch", "-x86_64"]
  # darwin/arm64:
  #   runner: macos-14
  #   shell: bash
  #
  # PASS 3 — uncomment together with the windows `assets:` pattern.
  # windows/amd64:
  #   runner: windows-latest
  #   shell: pwsh
  #
  # No windows/arm64 in ANY pass: upstream ships no
  # `age-vX.Y.Z-windows-arm64.zip` on any in-range release (full asset lists of
  # v1.3.0 and v1.3.1 re-listed from the API on 2026-08-04). Declaring it would
  # boot a windows-11-arm runner that self-skips and greens having tested
  # nothing.

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
